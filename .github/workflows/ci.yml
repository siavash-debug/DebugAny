name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Install, typecheck, test, and build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: debugany
          POSTGRES_USER: debugany
          POSTGRES_PASSWORD: debugany_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debugany -d debugany"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://debugany:debugany_ci_only@localhost:5432/debugany?schema=public
      REDIS_URL: redis://localhost:6379
      DEBUGANY_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run prisma:deploy --workspace @debugany/api

      - name: Typecheck API and web
        run: npm run typecheck

      - name: Test API (unit and database integration)
        run: npm test

      - name: Build and test SDK
        run: npm run build:sdk

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web
